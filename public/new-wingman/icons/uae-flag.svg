<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 40" width="100%" height="100%">
  <defs>
    <!-- 3D lighting overlay for the glossy fabric look -->
    <linearGradient id="uae-shade" x1="0" y1="0" x2="50" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.3" />
      <stop offset="0.5" stop-color="#000" stop-opacity="0.25" />
      <stop offset="0.9" stop-color="#fff" stop-opacity="0.35" />
      <stop offset="1" stop-color="#000" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  
  <!-- Green Stripe (Perfectly curved, parallel to the wave) -->
  <path d="M 0,12 Q 12.5,12 25,6 T 50,0 L 50,8.33 Q 37.5,8.33 25,14.33 T 0,20.33 Z" fill="#00732F" />
  
  <!-- White Stripe -->
  <path d="M 0,20.33 Q 12.5,20.33 25,14.33 T 50,8.33 L 50,16.66 Q 37.5,16.66 25,22.66 T 0,28.66 Z" fill="#fff" />
  
  <!-- Black Stripe -->
  <path d="M 0,28.66 Q 12.5,28.66 25,22.66 T 50,16.66 L 50,25 Q 37.5,25 25,31 T 0,37 Z" fill="#000" />
  
  <!-- Red Vertical Stripe (Mapped precisely to follow the left wave boundary) -->
  <path d="M 0,12 Q 7.5,12 15,9.84 L 15,34.84 Q 7.5,37 0,37 Z" fill="#FF0000" />
  
  <!-- 3D Shading Overlay -->
  <path d="M 0,12 Q 12.5,12 25,6 T 50,0 L 50,25 Q 37.5,25 25,31 T 0,37 Z" fill="url(#uae-shade)" />
</svg>