<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 40" width="100%" height="100%">
  <defs>
    <!-- 3D lighting overlay for the glossy fabric look -->
    <linearGradient id="usa-shade" x1="0" y1="0" x2="50" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.3" />
      <stop offset="0.5" stop-color="#000" stop-opacity="0.25" />
      <stop offset="0.9" stop-color="#fff" stop-opacity="0.35" />
      <stop offset="1" stop-color="#000" stop-opacity="0.1" />
    </linearGradient>
    
    <!-- Authentic 5-pointed star -->
    <path id="us-star" d="M 0,-1 L 0.22,-0.31 L 0.95,-0.31 L 0.36,0.12 L 0.59,0.81 L 0,0.38 L -0.59,0.81 L -0.36,0.12 L -0.95,-0.31 L -0.22,-0.31 Z" fill="#fff" transform="scale(0.55)" />
    
    <!-- Staggered star grid pattern (rotated perfectly to match the flag's wave angle) -->
    <pattern id="stars" width="3.8" height="2.8" patternUnits="userSpaceOnUse" patternTransform="translate(0.5, 11) rotate(-11)">
      <use href="#us-star" x="0.95" y="0.7" />
      <use href="#us-star" x="2.85" y="0.7" />
      <use href="#us-star" x="0" y="2.1" />
      <use href="#us-star" x="1.9" y="2.1" />
      <use href="#us-star" x="3.8" y="2.1" />
    </pattern>
  </defs>
  
  <!-- Base Red Flag (Old Glory Red - Full curved shape) -->
  <path d="M 0,12 Q 12.5,12 25,6 T 50,0 L 50,25 Q 37.5,25 25,31 T 0,37 Z" fill="#B22234" />
  
  <!-- 6 White Stripes (Mathematically curved to stay perfectly parallel to the wave) -->
  <path d="M 0,13.92 Q 12.5,13.92 25,7.92 T 50,1.92 L 50,3.85 Q 37.5,3.85 25,9.85 T 0,15.85 Z" fill="#fff" />
  <path d="M 0,17.77 Q 12.5,17.77 25,11.77 T 50,5.77 L 50,7.69 Q 37.5,7.69 25,13.69 T 0,19.69 Z" fill="#fff" />
  <path d="M 0,21.61 Q 12.5,21.61 25,15.61 T 50,9.61 L 50,11.54 Q 37.5,11.54 25,17.54 T 0,23.54 Z" fill="#fff" />
  <path d="M 0,25.46 Q 12.5,25.46 25,19.46 T 50,13.46 L 50,15.38 Q 37.5,15.38 25,21.38 T 0,27.38 Z" fill="#fff" />
  <path d="M 0,29.31 Q 12.5,29.31 25,23.31 T 50,17.31 L 50,19.23 Q 37.5,19.23 25,25.23 T 0,31.23 Z" fill="#fff" />
  <path d="M 0,33.15 Q 12.5,33.15 25,27.15 T 50,21.15 L 50,23.08 Q 37.5,23.08 25,29.08 T 0,35.08 Z" fill="#fff" />
  
  <!-- Blue Canton (Old Glory Blue - precisely trimmed to the wave contour) -->
  <path d="M 0,12 Q 11,12 22,7.35 L 22,20.81 Q 11,25.46 0,25.46 Z" fill="#3C3B6E" />
  
  <!-- Stars Pattern Overlay -->
  <path d="M 0,12 Q 11,12 22,7.35 L 22,20.81 Q 11,25.46 0,25.46 Z" fill="url(#stars)" />
  
  <!-- 3D Shading Overlay -->
  <path d="M 0,12 Q 12.5,12 25,6 T 50,0 L 50,25 Q 37.5,25 25,31 T 0,37 Z" fill="url(#usa-shade)" />
</svg>