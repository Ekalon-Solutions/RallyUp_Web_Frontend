<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 40" width="100%" height="100%">
  <defs>
    <!-- 3D lighting overlay for the glossy fabric look -->
    <linearGradient id="au-shade" x1="0" y1="0" x2="50" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.3" />
      <stop offset="0.5" stop-color="#000" stop-opacity="0.25" />
      <stop offset="0.9" stop-color="#fff" stop-opacity="0.35" />
      <stop offset="1" stop-color="#000" stop-opacity="0.1" />
    </linearGradient>
    <clipPath id="au-canton">
      <path d="M 0,12 Q 12.5,12 25,6 L 25,18.5 Q 12.5,24.5 0,24.5 Z" />
    </clipPath>
    
    <!-- Authentic 7-pointed star (Commonwealth & Main Crux Stars) -->
    <path id="star7" d="M 0,-1 L 0.2,-0.4 L 0.78,-0.62 L 0.44,-0.1 L 0.98,0.22 L 0.35,0.28 L 0.43,0.9 L 0,0.45 L -0.43,0.9 L -0.35,0.28 L -0.98,0.22 L -0.44,-0.1 L -0.78,-0.62 L -0.2,-0.4 Z" fill="#fff" />
    
    <!-- Authentic 5-pointed star (Epsilon Crucis) -->
    <path id="star5" d="M 0,-1 L 0.22,-0.31 L 0.95,-0.31 L 0.36,0.12 L 0.59,0.81 L 0,0.38 L -0.59,0.81 L -0.36,0.12 L -0.95,-0.31 L -0.22,-0.31 Z" fill="#fff" />
  </defs>
  
  <!-- Base Blue (Full curved shape) -->
  <path d="M 0,12 Q 12.5,12 25,6 T 50,0 L 50,25 Q 37.5,25 25,31 T 0,37 Z" fill="#012169" />

  <!-- Union Jack -->
  <g clip-path="url(#au-canton)">
    <!-- Diagonals -->
    <line x1="0" y1="12" x2="25" y2="18.5" stroke="#fff" stroke-width="2.5" />
    <line x1="0" y1="24.5" x2="25" y2="6" stroke="#fff" stroke-width="2.5" />
    <line x1="0" y1="12" x2="25" y2="18.5" stroke="#CC142B" stroke-width="1.2" />
    <line x1="0" y1="24.5" x2="25" y2="6" stroke="#CC142B" stroke-width="1.2" />
    
    <!-- Crosses mapped to the wave -->
    <path d="M 0,18.25 Q 12.5,18.25 25,12.25" stroke="#fff" stroke-width="4.5" fill="none" />
    <path d="M 0,18.25 Q 12.5,18.25 25,12.25" stroke="#CC142B" stroke-width="2.5" fill="none" />
    <polygon points="10.5,8 14.5,6 14.5,21 10.5,23" fill="#fff" />
    <polygon points="11.75,7.5 13.25,6.7 13.25,21.7 11.75,22.5" fill="#CC142B" />
  </g>

  <!-- Commonwealth Star (7 points) -->
  <use href="#star7" transform="translate(12.5, 30) scale(2.5)" />
  
  <!-- Southern Cross (Crux) -->
  <!-- Gamma Crucis (top, 7 points) -->
  <use href="#star7" transform="translate(37.5, 9.5) scale(1.5)" />
  <!-- Alpha Crucis (bottom, 7 points) -->
  <use href="#star7" transform="translate(37.5, 21.5) scale(1.5)" />
  <!-- Beta Crucis (left, 7 points) -->
  <use href="#star7" transform="translate(32.5, 15.5) scale(1.5)" />
  <!-- Delta Crucis (right, 7 points) -->
  <use href="#star7" transform="translate(42.5, 14.5) scale(1.5)" />
  <!-- Epsilon Crucis (small right, 5 points) -->
  <use href="#star5" transform="translate(40, 18.5) scale(1)" />

  <!-- 3D Shading Overlay -->
  <path d="M 0,12 Q 12.5,12 25,6 T 50,0 L 50,25 Q 37.5,25 25,31 T 0,37 Z" fill="url(#au-shade)" />
</svg>